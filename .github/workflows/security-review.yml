name: Security Review

on:
  issue_comment:
    types: [created]

jobs:
  security-review:
    # Only run on pull request comments
    if: github.event.issue.pull_request && contains(github.event.comment.body, 'do security review')
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write
      issues: write
    
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          # Checkout the PR branch
          ref: ${{ github.event.pull_request.head.sha }}
          
      - name: Checkout argus-agent repository
        uses: actions/checkout@v4
        with:
          repository: kun6fup4nd4/argus-agent
          path: argus-agent
          
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          
      - name: Install dependencies
        run: |
          cd argus-agent
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          
      - name: Run security review
        run: |
          cd argus-agent
          python agent.py --target ../ --pr ${{ github.event.issue.number }}
        env:
          GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Google Gemini API authentication - check agno docs for exact variable name
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || secrets.ORG_GOOGLE_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS || secrets.ORG_GOOGLE_APPLICATION_CREDENTIALS }}
          # Optional integrations
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN || secrets.ORG_SLACK_BOT_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY || secrets.ORG_LINEAR_API_KEY }}
          
      - name: Comment on PR with results
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const comment = `🔍 Security review completed. Check the action logs for detailed results.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });